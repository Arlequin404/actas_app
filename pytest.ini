[pytest]
addopts = --strict-markers --tb=short
markers =
    unit: pruebas rápidas de funciones aisladas
    integration: pruebas reales entre APIs, PostgreSQL, SMTP y archivos
    e2e: pruebas completas mediante navegador
    destructive: pruebas de restauración que reemplazan las bases del entorno de pruebas
timeout = 180
