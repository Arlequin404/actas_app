{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6"><div class="card shadow-sm"><div class="card-body p-4">
<h2 class="text-primary mb-4">Restablecer contraseña</h2>
<form method="POST" action="{{ url_for('restablecer_contraseña', token=token) }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="mb-3"><label for="password" class="form-label">Nueva contraseña</label><input type="password" name="password" id="password" class="form-control" minlength="6" autocomplete="new-password" required></div>
<div class="mb-3"><label for="confirm_password" class="form-label">Confirmar contraseña</label><input type="password" name="confirm_password" id="confirm_password" class="form-control" minlength="6" autocomplete="new-password" required></div>
<button type="submit" class="btn btn-success">Restablecer contraseña</button>
</form></div></div></div></div>
{% endblock %}
